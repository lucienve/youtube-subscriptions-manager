name: Deploy to Google Apps Script

on:
  workflow_run:
    workflows: ["Lint"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-gas
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    env:
      TEMPLATE_SCRIPT_ID: ${{ secrets.TEMPLATE_SCRIPT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Push code using clasp (Personal Project)
        uses: lucienve/clasp-action@v2
        with:
          refreshToken: ${{ secrets.REFRESH_TOKEN }}
          clientId: ${{ secrets.CLIENT_ID }}
          clientSecret: ${{ secrets.CLIENT_SECRET }}
          scriptId: ${{ secrets.SCRIPT_ID }}
          command: 'push'

      - name: Push code using clasp (Template Project)
        if: ${{ env.TEMPLATE_SCRIPT_ID != '' }}
        uses: lucienve/clasp-action@v2
        with:
          refreshToken: ${{ secrets.REFRESH_TOKEN }}
          clientId: ${{ secrets.CLIENT_ID }}
          clientSecret: ${{ secrets.CLIENT_SECRET }}
          scriptId: ${{ env.TEMPLATE_SCRIPT_ID }}
          command: 'push'
